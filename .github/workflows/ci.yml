name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build, Typecheck, and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript Project
        run: npm run typecheck

      - name: Run Test Suite with Coverage Gate (>= 90%)
        run: npm test

      - name: Build Core, CLI, and Demo Packages
        run: npm run build

      - name: Verify CLI Dry-Run Packaging
        run: |
          cd packages/cli
          npm publish --dry-run

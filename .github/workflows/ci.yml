name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build, Typecheck, and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Typecheck TypeScript Project
        run: npm run typecheck

      - name: Lint with ESLint
        run: npm run lint

      - name: Run Test Suite with Coverage Gate (>= 90%)
        run: npm test

      - name: Enforce Core Coverage Threshold (>= 90%)
        run: npm run test --workspace=@anchor-cctp/core-sdk

      - name: Build Core, CLI, and Demo Packages
        run: npm run build

      - name: Verify CLI Dry-Run Packaging
        run: |
          cd packages/cli
          npm publish --dry-run
